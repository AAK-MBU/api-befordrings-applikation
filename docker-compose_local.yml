services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: befordringssystemet-api
    environment:
      API_KEY: ${API_KEY}
      API_KEY_HASHES: ${API_KEY_HASHES}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_ENVIRONMENT: ${OIDC_ENVIRONMENT}
      SESSION_SECRET: ${SESSION_SECRET}
      # Point requests at the CA bundle *inside* the container (Linux path),
      # overriding the Windows path in .env. The file is mounted below.
      REQUESTS_CA_BUNDLE: /app/certs/aarhus_root.pem
      APPREG_THUMBPRINT: ${APPREG_THUMBPRINT}
      CLIENT_ID: ${CLIENT_ID}
      TENANT: ${TENANT}
      GRAPH_CERT_PEM: /app/certs/sharepoint-graph-client-fixed.pem
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the host cert dir into the container so REQUESTS_CA_BUNDLE resolves.
      - C:/tmp/certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - befordringssystemet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: befordringssystemet-frontend
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      BEFORDRING_API_KEY: ${BEFORDRING_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "80:80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - befordringssystemet-network

networks:
  befordringssystemet-network: {}
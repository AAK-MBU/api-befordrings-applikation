markup_kvittering_til_ansoeger:
  '#type': markup
  '#display_on': view
  '#markup': '<p>Kære [webform_submission:values:navn_mitid:raw]<br><br>Tak for din ansøgning om kørsel.<br>Vi behandler din ansøgning hurtigst muligt. Der kan gå 3-6 uger, før du hører fra os. Vi giver besked i din digitale postkasse, når vi har truffet afgørelse i sagen.</p><p>Har du spørgsmål til kørsel så<br><a href="https://post.borger.dk/send/2ea2e7ff-bad5-471d-a5c0-a63cbbd076d6/c1b1779c-9286-44d1-8361-461a34d1f6ad/" target="_blank">skriv sikkert til os her (post.borger.dk)&nbsp;</a></p><p>Venlig hilsen&nbsp;<br><strong>Kørsel af skoleelever</strong>&nbsp;<br>Børn og Unge Aarhus Kommune</p><p>&nbsp;</p><p>Nedenfor kan du se de oplysninger du har givet os i din ansøgning.</p>'
markup_01:
  '#type': markup
  '#display_on': view
  '#markup': '<h2><strong>Ansøgning om skolebuskørsel</strong></h2>'
kvittering_til_foraeldremyndighedsindehaver:
  '#type': os2forms_attachment
  '#title': 'Kvittering til forældremyndighedsindehaver'
  '#filename': 'Kvittering for ansøgning om kørsel af skoleelev med skolebus i Aarhus Kommune.pdf'
  '#export_type': pdf
  '#digital_signature': 0
  '#excluded_elements':
    kvittering_paa_ansoegning_til_budget_regnskab: kvittering_paa_ansoegning_til_budget_regnskab
    markup_indledning: markup_indledning
  '#exclude_empty': true
  '#exclude_empty_checkbox': true
kvittering_paa_ansoegning_til_budget_regnskab:
  '#type': os2forms_attachment
  '#title': 'Kvittering på ansøgning til Budget & Regnskab'
  '#filename': 'Ansøgning om kørsel af skoleelev med skolebus i Aarhus Kommune.pdf'
  '#export_type': pdf
  '#digital_signature': 0
  '#excluded_elements':
    markup_kvittering_til_ansoeger: markup_kvittering_til_ansoeger
    kvittering_til_foraeldremyndighedsindehaver: kvittering_til_foraeldremyndighedsindehaver
    markup_indledning: markup_indledning
  '#exclude_empty': true
  '#exclude_empty_checkbox': true
side_1:
  '#type': wizard_page
  '#title': 'Indledende oplysninger'
  section_intro:
    '#type': section
    '#title': Intro
    '#title_display': invisible
    '#attributes':
      style: 'background: #7f7f7f; padding: 25px;'
    markup_indledning:
      '#type': markup
      '#wrapper_attributes':
        style: 'color: white;'
      '#markup': '<p>Du er i gang med at ansøge om&nbsp;skolebuskørsel i Aarhus Kommune. Du kan ansøge om bevilling af kørsel til dit barn, når dit barn går på distriktsskolen eller er henvist til et andet skoletilbud. Du kan kun få bevilling til kørsel, hvis skolevejen er for lang eller trafikfarlig. Når du ansøger om&nbsp;skolebuskørsel, skal du oplyse dit barns skoleskema (ringetider), så det er en god idé at have ved hånden.&nbsp;</p><p>Hvis dit barn har ret til kørsel, vil du også få at vide om der oprettes en skolebus eller om dit barn bevilges en anden form for kørsel. Vi giver besked i din digitale postkasse, når vi har truffet afgørelse i dit barns sag.</p><p>Du kan læse om behandling af personoplysninger i Børn og Unge <a href="https://www.aarhus.dk/om-kommunen/databeskyttelse/behandling-af-personoplysninger-i-boern-og-unge/" target="_blank">her</a>, og specifikt om vores behandling ved <a href="https://aarhus.dk/om-kommunen/databeskyttelse/behandling-af-personoplysninger-i-boern-og-unge/koersel-af-skoleelever" target="_blank">kørsel af elever</a> her. (Modtager du brevet fysisk, kan du finde informationen på <a href="http://www.aarhus.dk/personoplysningerimbu" target="_blank">www.aarhus.dk/personoplysningerimbu</a>).</p>'
  section_dine_oplysninger:
    '#type': section
    '#title': 'Dine oplysninger'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    navn_mitid:
      '#type': os2forms_nemid_name
      '#title': Navn
      '#multiple': false
      '#readonly': true
    cpr_nummer_mitid:
      '#type': os2forms_nemid_cpr
      '#title': CPR-nummer
      '#multiple': false
      '#readonly': true
    er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v:
      '#type': radios
      '#title': 'Er du forældremyndighedsindehaver til barnet der ansøges på vegne af?'
      '#options':
        Ja: Ja
        Nej: Nej
      '#required': true
    angiv_dine_kontaktoplysinger:
      '#type': textfield
      '#title': Kontaktoplysninger
      '#description': '<p>Telefonnummer</p>'
      '#input_mask': '+45 99999999'
    angiv_din_tilknytning_til_barnet:
      '#type': select
      '#title': 'Angiv din tilknytning til barnet'
      '#options':
        Værge: Værge
        Plejefamilie: Plejefamilie
        Bosted: Bosted
      '#states':
        visible:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            value: Nej
        required:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            value: Nej
  section_oplysninger_om_barnet:
    '#type': section
    '#title': 'Oplysninger om barnet'
    '#states':
      visible:
        - ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            value: Ja
        - xor
        - ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            value: Nej
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    vaelg_barn:
      '#type': os2forms_nemid_children_select
      '#title': 'Vælg dit barn fra listen'
      '#states':
        disabled:
          ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
            checked: true
        visible:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            value: Ja
        required:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            value: Ja
          ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
            checked: false
    mit_barn_kommer_ikke_frem_i_listen:
      '#type': checkbox
      '#title': 'Mit barn kommer ikke frem i listen'
      '#states':
        visible:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            value: Ja
        disabled:
          ':input[name="vaelg_barn"]':
            filled: true
    barnets_oplysninger_mitid:
      '#type': container
      '#states':
        visible:
          ':input[name="vaelg_barn"]':
            filled: true
      barnets_navn_mitid:
        '#type': os2forms_mitid_child_name
        '#title': 'Barnets navn'
        '#multiple': false
        '#readonly': true
      cpr_nummer_barn_mitid:
        '#type': os2forms_mitid_child_cpr
        '#title': 'Barnets CPR-nummer'
        '#multiple': false
        '#readonly': true
      barnets_adresse_mitid:
        '#type': os2forms_mitid_child_address
        '#title': Adresse
        '#multiple': false
        '#readonly': true
    barnets_oplysninger_manuelt:
      '#type': container
      '#states':
        visible:
          - ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
              checked: true
          - xor
          - ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
              value: Nej
      barnets_navn_manuelt:
        '#type': textfield
        '#title': 'Barnets navn'
        '#states':
          required:
            - ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
                checked: true
            - xor
            - ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
                value: Nej
      cpr_nummer_barn_manuelt:
        '#type': textfield
        '#title': 'Barnets CPR-nummer'
        '#input_mask': '9999999999'
        '#pattern': '^(?:(?:31(?:0[13578]|1[02])|(?:30|29)(?:0[13-9]|1[0-2])|(?:0[1-9]|1[0-9]|2[0-8])(?:0[1-9]|1[0-2]))[0-9]{2}-?[0-9]|290200-?[4-9]|2902(?:(?!00)[02468][048]|[13579][26])-?[0-3])[0-9]{3}|000000-?0000$'
        '#pattern_error': 'Angiv et korrekt cpr-nummer.'
        '#states':
          required:
            - ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
                checked: true
            - xor
            - ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
                value: Nej
      barnets_adresse_manuelt:
        '#type': os2forms_dawa_address
        '#title': 'Barnets folkeregisteradresse'
        '#description': '<p><strong>Skriv venligst hele adressen, før du vælger den i listen.</strong><br>Eksempel: <em>Søndergade 12, 1. th., 8000 Aarhus C</em></p>'
        '#states':
          required:
            - ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
                checked: true
            - xor
            - ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
                value: Nej
        '#remove_place_name': 0
    barnet_skal_koeres_til_fra_anden_adresse:
      '#type': checkbox
      '#title': 'Jeg ønsker at barnet bliver kørt til/fra en anden adresse end folkeregisteradresse'
    container_anden_adresse:
      '#type': container
      '#states':
        visible:
          ':input[name="barnet_skal_koeres_til_fra_anden_adresse"]':
            checked: true
      barnets_anden_adresse:
        '#type': os2forms_dawa_address
        '#title': 'Ønsket adresse'
        '#description': '<p>Der køres kun mellem distriktsskole/henvisningsskole og folkeregisteradresse&nbsp;</p><p><strong>Skriv venligst hele adressen, før du vælger den i listen.</strong><br>Eksempel: <em>Søndergade 12, 1. th., 8000 Aarhus C</em></p>'
        '#states':
          required:
            ':input[name="barnet_skal_koeres_til_fra_anden_adresse"]':
              checked: true
        '#remove_place_name': 0
      begrundelse_for_valg_af_anden_adresse:
        '#type': textarea
        '#title': 'Begrundelse for valg af anden adresse'
        '#states':
          required:
            ':input[name="barnet_skal_koeres_til_fra_anden_adresse"]':
              checked: true
  page_1_next_page:
    '#type': webform_actions
    '#title': 'Side 1 - Næste side'
side_2:
  '#type': wizard_page
  '#title': 'Skole og begrundelse for ansøgning'
  section_oplysninger_om_skole:
    '#type': section
    '#title': 'Oplysninger om skole'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    barnets_skole:
      '#type': remote_select_element
      '#title': Skole
      '#description': '<p>Den skole, der søges om kørsel til og fra</p>'
      '#attributes':
        style: 'width:30em'
      '#endpoint': 'https://mbuweb.adm.aarhuskommune.dk/dataapi/entities?type=kommunalskoleFlereLokationer'
      '#data_key': value
      '#data_value': value
      '#use_empty_option': true
      '#empty_option': Vælg
      '#use_select2': true
      '#required': true
    barnets_klassetrin:
      '#type': select
      '#title': Klassetrin
      '#options':
        '0. klasse': '0. klasse'
        '1. klasse': '1. klasse'
        '2. klasse': '2. klasse'
        '3. klasse': '3. klasse'
        '4. klasse': '4. klasse'
        '5. klasse': '5. klasse'
        '6. klasse': '6. klasse'
        '7. klasse': '7. klasse'
        '8. klasse': '8. klasse'
        '9. klasse': '9. klasse'
        '10. klasse': '10. klasse'
      '#required': true
    vaelg_klassetype:
      '#type': select
      '#title': 'Vælg klassetype'
      '#options':
        Specialklasse: Specialklasse
        Modtagelsesklasse: Modtagelsesklasse
        'Nest Klasse': 'Nest Klasse'
        'Almen Klasse': 'Almen Klasse'
      '#required': true
  section_hvorfor_ansoeges_der_om_koersel:
    '#type': section
    '#title': 'Hvorfor ansøger du om kørsel  på vegne af dit barn?'
    '#description': '<p>Sæt kryds:</p>'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    langt_mellem_skole_og_hjem:
      '#type': checkbox
      '#title': 'Mit barn har langt mellem skole og hjem'
      '#description': '<p>Elever, der har længere skolevej end 2,5 km i børnehaveklasse og på 1.-3. klassetrin, 6 km på 4.-6. klassetrin, 7 km på 7.-9. klassetrin og 9 km i 10. klasse.</p>'
      '#states':
        required:
          ':input[name="sygdom_funktionsnedsaettelse_handicap"]':
            unchecked: true
          ':input[name="trafikfarlig_vej"]':
            unchecked: true
    trafikfarlig_vej:
      '#type': checkbox
      '#title': 'Mit barn har en skolevej, som Aarhus Kommune har vurderet som trafikfarlig vej'
      '#description': '<p>Der er i udgangspunktet ikke tale om farlig skolevej, hvis:</p><ul><li>Der er fortov</li><li>Der er cykelsti</li><li>Vejkryds er trafikregulerede eller der er afmærkede fodgængerfelter</li></ul><p>Det er dit ansvar som forælder, at dit barn har modtaget den nødvendige færdselsundervisning / træning i trafikken, så skolevejen er velkendt og barnet er modent til at færdes til og fra skole.</p>'
      '#states':
        required:
          ':input[name="sygdom_funktionsnedsaettelse_handicap"]':
            unchecked: true
          ':input[name="langt_mellem_skole_og_hjem"]':
            unchecked: true
  page_2_next_page:
    '#type': webform_actions
    '#title': 'Side 2 - Næste side'
side_4:
  '#type': wizard_page
  '#title': 'Planlægning af kørsel'
  section_information_om_koersel:
    '#type': section
    '#title': 'Information om kørsel'
    '#description': '<p>Hvornår ønsker du kørsel af dit barn?</p>'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    '#format': container
    container_skolebus_yderligere_information:
      '#type': container
      morgenkoersel:
        '#type': radios
        '#title': Morgenkørsel
        '#options':
          Ja: Ja
          Nej: Nej
        '#required': true
      eftermiddagskoersel:
        '#type': radios
        '#title': Eftermiddagskørsel
        '#options':
          Ja: Ja
          Nej: Nej
        '#required': true
      flexbox_skolebus_morgen_eftermiddag:
        '#type': flexbox
        '#attributes':
          style: 'width:30em;background: white;'
    section_dato_for_foerste_koersel:
      '#type': section
      '#title': 'Dato for første kørsel'
      '#title_display': invisible
      '#format': container
      dato_for_foerste_koersel:
        '#type': date
        '#title': 'Dato for første kørsel'
        '#description': '<p>Der er 3-6 ugers sagsbehandlingstid fra ansøgningstidspunktet. Du kan derfor ikke vælge en dato før om 3 uger. Hvis du søger om skolebuskørsel fra kommende&nbsp; skoleår, vil du få svar på din ansøgning senest den 30.&nbsp; juni.</p>'
        '#required': true
        '#format': d-m-Y
        '#date_date_min': '+3 weeks'
        '#date_date_format': ''
  section_planlaegning_af_koerslen:
    '#type': section
    '#title': 'Planlægning af kørslen'
    '#description': '<p>Hjemkørsel planlægges som fast kørsel så vidt muligt&nbsp;efter sidste time. Der kan forekomme ventetid på skolen.&nbsp;Kørslen planlægges som udgangspunkt for et skoleår ad gangen og kan ikke ændres fra dag til dag. Hvis dit barns skoleskema ændres, giver skolen besked til busleverandøren.</p>'
    '#states':
      invisible:
        ':input[name="morgenkoersel"]':
          value: Nej
        ':input[name="eftermiddagskoersel"]':
          value: Nej
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    '#format': container
    fieldset_skema_ringetid_morgen_eftermiddag:
      '#type': fieldset
      '#title': 'Angiv ringetid for morgen og efter sidste lektion'
      '#attributes':
        style: 'background: white;'
      '#format': container
      markup_oplysninger_om_barnets_skoleskema:
        '#type': markup
        '#markup': |
          <p>
            Det er kun muligt at indtaste barnets undervisningstider og eventuelt ønsket SFO-hjemkørselstidspunkt. Tider før kl. 08.00 og efter kl. 16.00 kan ikke registreres i systemet.
          </p>
      skoleskema_kendes_ikke:
        '#type': checkbox
        '#title': 'Jeg kender ikke mit barns skoleskema'
      koersel_morgen:
        '#type': flexbox
        '#states':
          visible:
            ':input[name="morgenkoersel"]':
              value: Ja
            ':input[name="skoleskema_kendes_ikke"]':
              unchecked: true
        mandag_fra:
          '#type': time
          '#title': 'Mandag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        tirsdag_fra:
          '#type': time
          '#title': 'Tirsdag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        onsdag_fra:
          '#type': time
          '#title': 'Onsdag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        torsdag_fra:
          '#type': time
          '#title': 'Torsdag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        fredag_fra:
          '#type': time
          '#title': 'Fredag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
      koersel_eftermiddag:
        '#type': flexbox
        '#states':
          visible:
            ':input[name="eftermiddagskoersel"]':
              value: Ja
            ':input[name="skoleskema_kendes_ikke"]':
              unchecked: true
        mandag_til:
          '#type': time
          '#title': 'Mandag eftermiddag'
          '#attributes':
            style: 'width:9em;'
          '#min': '11:00:00'
          '#max': '16:00:00'
        tirsdag_til:
          '#type': time
          '#title': 'Tirsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        onsdag_til:
          '#type': time
          '#title': 'Onsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        torsdag_til:
          '#type': time
          '#title': 'Torsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        fredag_til:
          '#type': time
          '#title': 'Fredag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
  section_sfo:
    '#type': section
    '#title': SFO
    '#states':
      visible:
        ':input[name="eftermiddagskoersel"]':
          value: Ja
      invisible:
        ':input[name="morgenkoersel"]':
          value: Nej
        ':input[name="eftermiddagskoersel"]':
          value: Nej
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    er_barnet_tilmeldt_sfo_:
      '#type': radios
      '#title': 'Er barnet tilmeldt SFO?'
      '#options': yes_no
      '#states':
        required:
          ':input[name="twig_sfo_visibility"]':
            value: '1'
    container_oensket_afhentningstidspunkt_fra_sfo:
      '#type': container
      '#title': 'Ønsket afhentningstidspunkt fra SFO'
      '#states':
        visible:
          ':input[name="er_barnet_tilmeldt_sfo_"]':
            value: Ja
      markup:
        '#type': markup
        '#markup': |
          <p>
            <strong>Ønsket afhentningstidspunkt</strong>
            Der køres kun hjem fra SFO på faste afhentningstidspunkter, som fastsættes af den enkelte skole.
          </p>
      skema_sfo:
        '#type': fieldset
        '#title': 'Angiv ønsket hjemkørselstidspunkt efter SFO'
        '#states':
          visible:
            ':input[name="er_barnet_tilmeldt_sfo_"]':
              value: Ja
        '#attributes':
          style: 'background: white;'
        flexbox_sfo:
          '#type': flexbox
          container_mandag__sfo:
            '#type': container
            '#flex': 7
            mandag__sfo:
              '#type': time
              '#title': Mandag
              '#min': '12:00:00'
              '#max': '16:00:00'
          container_tirsdag__sfo:
            '#type': container
            '#flex': 7
            tirsdag__sfo:
              '#type': time
              '#title': Tirsdag
              '#min': '12:00:00'
              '#max': '16:00:00'
          container_onsdag__sfo:
            '#type': container
            '#flex': 7
            onsdag__sfo:
              '#type': time
              '#title': Onsdag
              '#min': '12:00:00'
              '#max': '16:00:00'
          container_torsdag__sfo:
            '#type': container
            '#flex': 7
            torsdag__sfo:
              '#type': time
              '#title': Torsdag

  page_5_submit:
    '#type': webform_actions
    '#title': 'Side 5 - Gennemse'
twigs:
  '#type': section
  '#title': TWIGS
  '#title_display': invisible
  '#description_display': invisible
  '#attributes':
    style: 'display:none'
  '#format': container
  twig_koersel_visibility:
    '#type': computed_twig
    '#title': twig_koersel_visibility
    '#states_clear': false
    '#display_on': form
    '#template': |-
      {# Return values:
        1 = skjul_alt
        2 = skjul_intet
        3 = skjul_morgen
        4 = skjul_eftermiddag
      #}

      {# If rutekørsel is NOT selected → hide everything #}
      {% if data.rutekoersel_med_taxa_minibus != '1' %}
        {{ 1 }}
      {% else %}

        {% set morgen = (data.rutekoersel_aflevering_morgen == '1') %}
        {% set eftermiddag = (data.rutekoersel_afhentning_eftermiddag == '1') %}

        {# No selections → show nothing (skjul_intet) #}
        {% if not morgen and not eftermiddag %}
          {{ 2 }}

        {# Morning only → hide afternoon #}
        {% elseif morgen and not eftermiddag %}
          {{ 3 }}

        {# Afternoon only → hide morning #}
        {% elseif eftermiddag and not morgen %}
          {{ 4 }}

        {# Both selected → equivalent of "show everything" #}
        {% else %}
          {{ 2 }}
        {% endif %}
      {% endif %}
    '#whitespace': trim
    '#store': true
  twig_sfo_visibility:
    '#type': computed_twig
    '#title': twig_sfo_visibility
    '#states_clear': false
    '#display_on': form
    '#template': |-
      {% set rutekoersel = (data.rutekoersel_med_taxa_minibus == '1') %}
      {% set buskort = (data.buskort_til_offentlig_transport == '1') %}
      {% set morgen = (data.rutekoersel_aflevering_morgen == '1') %}
      {% set eftermiddag = (data.rutekoersel_afhentning_eftermiddag == '1') %}

      {# 1. Eftermiddag always wins #}
      {% if eftermiddag %}
        {{ 1 }}

      {# 2. Nothing selected at all #}
      {% elseif not rutekoersel and not buskort %}
        {{ 3 }}

      {# 3. Only buskort #}
      {% elseif not rutekoersel and buskort %}
        {{ 2 }}

      {# 4. Rutekørsel + morgen only (no buskort) #}
      {% elseif rutekoersel and morgen and not eftermiddag and not buskort %}
        {{ 3 }}

      {# 5. Rutekørsel but no selections #}
      {% elseif rutekoersel and not morgen and not eftermiddag %}
        {{ 1 }}

      {% elseif rutekoersel and morgen and not eftermiddag and buskort %}
        {{ 2 }}

      {# fallback #}
      {% else %}
        {{ 3 }}
      {% endif %}
    '#whitespace': trim
    '#store': true
  twig_barnets_navn:
    '#type': computed_twig
    '#title': Twig_barnets_navn
    '#template': '{{ data.barnets_navn_mitid ?: data.barnets_navn_manuelt }}'
  twig_elevens_navn:
    '#type': computed_twig
    '#title': Twig_elevens_navn
    '#template': '{{ data.elevens_navn ?: data.navn_mitid }}'
    '#ajax': true
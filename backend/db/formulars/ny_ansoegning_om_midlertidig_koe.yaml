          visible:
            ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
              value: 'Mig selv'
        '#markup': |
          <p>
            Det er kun muligt at indtaste dine undervisningstider. Tider før kl. 08.00 og efter kl. 16.00 kan ikke registreres i systemet.
          </p>
      markup_oplysninger_om_barnets_skoleskema:
        '#type': markup
        '#states':
          visible:
            ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
              '!value': 'Jeg ansøger om kørsel til mig selv'
        '#markup': |
          <p>
            Det er kun muligt at indtaste barnets undervisningstider. Tider før kl. 08.00 og efter kl. 16.00 kan ikke registreres i systemet.
          </p>
      markup_ikke_oplyst_tidspunkter_for_koersel_paa_forrige_side:

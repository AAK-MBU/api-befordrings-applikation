          '#title': 'Mandag eftermiddag'
          '#attributes':
            style: 'width:9em;'
          '#min': '11:00:00'
          '#max': '16:00:00'
        tirsdag_til:
          '#type': time
          '#title': 'Tirsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        onsdag_til:
          '#type': time
          '#title': 'Onsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        torsdag_til:

      style: 'background: #E5EFFA; padding: 25px;'
    '#format': container
    jeg_giver_samtykke_til_at_der_maa_indhentes_oplysninger_om_mit_b:
      '#type': checkbox
      '#title': 'Jeg giver samtykke til, at der må indhentes oplysninger om mit barn fra skole'
      '#states':
        visible:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            '!value': 'Mig selv'
        required:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':
            '!value': 'Mig selv'
    jeg_giver_samtykke_til_at_der_maa_indhentes_oplysninger_om_mig_f:
      '#type': checkbox
      '#title': 'Jeg giver samtykke til, at der må indhentes oplysninger om mig fra skole'
      '#states':
        visible:
          ':input[name="er_du_foraeldremyndighedsindehaver_til_barnet_der_ansoeges_paa_v"]':

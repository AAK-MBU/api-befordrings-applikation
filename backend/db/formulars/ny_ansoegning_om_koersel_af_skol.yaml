        flexbox_sfo:
          '#type': flexbox
          container_mandag__sfo:
            '#type': container
            '#flex': 7
            mandag__sfo:
              '#type': time
              '#title': Mandag
              '#min': '12:00:00'
              '#max': '16:00:00'
          container_tirsdag__sfo:
            '#type': container
            '#flex': 7
            tirsdag__sfo:
              '#type': time
              '#title': Tirsdag
              '#min': '12:00:00'
              '#max': '16:00:00'
          container_onsdag__sfo:
            '#type': container
            '#flex': 7
            onsdag__sfo:
              '#type': time
              '#title': Onsdag
              '#min': '12:00:00'
              '#max': '16:00:00'
          container_torsdag__sfo:
            '#type': container
            '#flex': 7
            torsdag__sfo:
              '#type': time
              '#title': Torsdag
              '#min': '12:00:00'
              '#max': '16:00:00'
          container_fredag__sfo:
            '#type': container
            '#flex': 7
            fredag__sfo:
              '#type': time
              '#title': Fredag
              '#min': '12:00:00'
              '#max': '16:00:00'
  section_klubhs:
    '#type': section
    '#title': 'Klubben Holme Søndergård'
    '#states':
      visible:
        ':input[name="er_barnet_tilmeldt_sfo_"]':
          value: Nej
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    er_barnet_tilmeldt_klubhs_:
      '#type': radios
      '#title': 'Er barnet henvist til Klubben Holme Søndergård?'
      '#options': yes_no
      '#states':
        required:
          ':input[name="er_barnet_tilmeldt_sfo_"]':

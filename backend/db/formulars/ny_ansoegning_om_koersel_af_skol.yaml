      '#type': section
      '#title': 'Dato for første kørsel'
      '#title_display': invisible
      '#format': container
      dato_for_foerste_koersel:
        '#type': date
        '#title': 'Dato for første kørsel'
        '#description': '<p>Der er 3-6 ugers sagsbehandlingstid fra ansøgningstidspunktet. Du kan derfor ikke vælge en dato før om 3 uger.</p>'
        '#required': true
        '#format': d-m-Y
        '#date_date_min': '+3 weeks'
        '#date_date_format': ''
  page_3_next_page:
    '#type': webform_actions
    '#title': 'Side 3 - Næste side'
side_4:
  '#type': wizard_page
  '#title': 'Planlægning af kørsel'
  section_planlaegning_af_koerslen:
    '#type': section
    '#title': 'Planlægning af kørslen'
    '#description': '<p>Hjemkørsel planlægges som fast rutekørsel efter sidste time. Kørslen planlægges som udgangspunkt for et skoleår ad gangen og kan ikke ændres fra dag til dag. Hvis dit barns skoleskema ændres, giver skolen besked til Kørselskontoret.</p>'
    '#states':
      visible:
        ':input[name="twig_koersel_visibility"]':
          '!value': '1'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    fieldset_skema_ringetid_morgen_eftermiddag:
      '#type': fieldset
      '#title': 'Angiv ringetid for morgen og efter sidste lektion'
      '#attributes':
        style: 'background: white;'
      markup_oplysninger_om_barnets_skoleskema:
        '#type': markup
        '#markup': |
          <p>
            Det er kun muligt at indtaste barnets undervisningstider. Tider før kl. 08.00 og efter kl. 16.00 kan ikke registreres i systemet.
            Hvis der ønskes kørsel til morgen-SFO eller efter kl. 16.00, skal dette ansøges særskilt hos Familiecentret.
          </p>
      markup_ikke_oplyst_tidspunkter_for_koersel_paa_forrige_side:
        '#type': markup
        '#markup': |
          <p>OBS! Du har ikke markeret om rutekørsel skal finde sted om morgenen og/eller eftermiddagen!</p>
        '#states':
          visible:
            ':input[name="rutekoersel_aflevering_morgen"]':
              checked: false
            ':input[name="rutekoersel_afhentning_eftermiddag"]':
              checked: false
      skoleskema_kendes_ikke:
        '#type': checkbox
        '#title': 'Jeg kender ikke mit barns skoleskema'
      koersel_morgen:
        '#type': flexbox
        '#states':
          visible:
            ':input[name="twig_koersel_visibility"]':
              '!value': '4'
            ':input[name="skoleskema_kendes_ikke"]':
              unchecked: true
        mandag_fra:
          '#type': time
          '#title': 'Mandag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        tirsdag_fra:
          '#type': time
          '#title': 'Tirsdag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        onsdag_fra:
          '#type': time
          '#title': 'Onsdag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        torsdag_fra:
          '#type': time
          '#title': 'Torsdag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
        fredag_fra:
          '#type': time
          '#title': 'Fredag morgen'
          '#min': '08:00:00'
          '#max': '10:00:00'
          '#attributes':
            style: 'width:9em;'
      koersel_eftermiddag:
        '#type': flexbox
        '#states':
          visible:
            ':input[name="twig_koersel_visibility"]':
              '!value': '3'
            ':input[name="skoleskema_kendes_ikke"]':
              unchecked: true
        mandag_til:
          '#type': time
          '#title': 'Mandag eftermiddag'
          '#attributes':
            style: 'width:9em;'
          '#min': '11:00:00'
          '#max': '16:00:00'
        tirsdag_til:
          '#type': time
          '#title': 'Tirsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        onsdag_til:
          '#type': time
          '#title': 'Onsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        torsdag_til:
          '#type': time
          '#title': 'Torsdag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
        fredag_til:
          '#type': time
          '#title': 'Fredag eftermiddag'
          '#min': '11:00:00'
          '#max': '16:00:00'
          '#attributes':
            style: 'width:9em;'
  section_sfo:
    '#type': section
    '#title': SFO
    '#states':
      visible:
        ':input[name="twig_sfo_visibility"]':
          '!value': '3'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    er_barnet_tilmeldt_sfo_:
      '#type': radios
      '#title': 'Er barnet tilmeldt SFO?'
      '#options': yes_no
      '#states':
        required:
          ':input[name="twig_sfo_visibility"]':
            '!value': '3'
    container_oensket_afhentningstidspunkt_fra_sfo:
      '#type': container
      '#title': 'Ønsket afhentningstidspunkt fra SFO'
      '#states':
        visible:
          - ':input[name="er_barnet_tilmeldt_sfo_"]':
              value: Ja
          - or
          - ':input[name="twig_sfo_visibility"]':
              value: '1'
      markup:
        '#type': markup
        '#markup': |
          <p>
            <strong>Ønsket afhentningstidspunkt</strong>
            Bemærk kørslen planlægges som rutekørsel, så der kan være ventetid. Der køres kun hjem fra SFO hvis det kan ske uden etablering af særskilt kørsel. Kan hjemkørselstidspunktet ikke imødekommes henvises til familiecenteret i Sociale forhold og beskæftigelse.
          </p>
      skema_sfo:
        '#type': fieldset

    container_oensket_afhentningstidspunkt_fra_klubhs:
      '#type': container
      '#title': 'Ønsket afhentningstidspunkt fra Klubben Holme Søndergård'
      '#states':
        visible:
          ':input[name="er_barnet_tilmeldt_klubhs_"]':
            value: Ja
          ':input[name="twig_sfo_visibility"]':
            value: '1'
      markup_klubhs:
        '#type': markup
      skema_klubhs:
        '#type': fieldset
        '#title': 'Angiv ønsket hjemkørselstidspunkt fra Klubben Holme Søndergård'
        '#states':
          visible:
            ':input[name="er_barnet_tilmeldt_klubhs_"]':
              value: Ja
        '#attributes':
          style: 'background: white;'
        flexbox_klubhs:
          '#type': flexbox
          container_mandag__klubhs:
            '#type': container
            '#flex': 7
            mandag__klubhs:
              '#type': time
              '#title': Mandag
          container_tirsdag__klubhs:
            '#type': container
            '#flex': 7
            tirsdag__klubhs:
              '#type': time
              '#title': Tirsdag
          container_onsdag__klubhs:
            '#type': container
            '#flex': 7
            onsdag__klubhs:
              '#type': time
              '#title': Onsdag
          container_torsdag__klubhs:
            '#type': container
            '#flex': 7
            torsdag__klubhs:
              '#type': time
              '#title': Torsdag
          container_fredag__klubhs:
            '#type': container
            '#flex': 7
            fredag__klubhs:
              '#type': time
              '#title': Fredag
  andre_relevante_oplysninger_sektion:
    '#type': section
    '#title': 'Andre relevante oplysninger'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    '#format': container
    andre_relevante_oplysninger:
      '#type': textarea
      '#title': '<h4>Andre relevante oplysninger</h4>'
      '#description': '<p>Eventuelle andre oplysninger, som du mener er vigtige for ansøgningen</p>'
      '#title_display': none
      '#placeholder': 'Eventuelle andre oplysninger, som du mener er vigtige for ansøgningen'
  page_4_next_page:
    '#type': webform_actions
    '#title': 'Side 4 - Næste side'
side_5:
  '#type': wizard_page
  '#title': Samtykke
  section_samtykke:
    '#type': section
    '#title': Samtykke
    '#description': '<p>Skal udfyldes, da vi ikke kan behandle din ansøgning uden at indhente oplysninger.</p>'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    jeg_giver_samtykke_til_at_der_maa_indhentes_oplysninger_om_mit_b:
      '#type': checkbox
      '#title': 'Jeg giver samtykke til, at der må indhentes oplysninger om mit barn fra skole og andre afdelinger i Børn og Unge f.eks. PPR'
      '#required': true
    jeg_giver_samtykke_til_at_boern_og_unge_maa_dele_oplysninger_om:
      '#type': checkbox
      '#title': 'Jeg giver samtykke til at Børn og Unge må dele oplysninger om mit barn med Familiecenteret i Sociale Forhold og beskæftigelse.'
  page_5_submit:
    '#type': webform_actions
    '#title': 'Side 5 - Gennemse'
twigs:
  '#type': section
  '#title': TWIGS
  '#title_display': invisible
  '#description_display': invisible
  '#attributes':
    style: 'display:none'
  '#format': container
  twig_koersel_visibility:
    '#type': computed_twig
    '#title': twig_koersel_visibility
    '#states_clear': false
    '#display_on': form
    '#template': |-
      {# Return values:
        1 = skjul_alt
        2 = skjul_intet
        3 = skjul_morgen
        4 = skjul_eftermiddag
      #}

      {# If rutekørsel is NOT selected → hide everything #}
      {% if data.rutekoersel_med_taxa_minibus != '1' %}
        {{ 1 }}
      {% else %}

        {% set morgen = (data.rutekoersel_aflevering_morgen == '1') %}
        {% set eftermiddag = (data.rutekoersel_afhentning_eftermiddag == '1') %}

        {# No selections → show nothing (skjul_intet) #}
        {% if not morgen and not eftermiddag %}
          {{ 2 }}

        {# Morning only → hide afternoon #}
        {% elseif morgen and not eftermiddag %}
          {{ 3 }}

        {# Afternoon only → hide morning #}
        {% elseif eftermiddag and not morgen %}
          {{ 4 }}

        {# Both selected → equivalent of "show everything" #}
        {% else %}
          {{ 2 }}
        {% endif %}
      {% endif %}
    '#whitespace': trim
    '#store': true
  twig_sfo_visibility:
    '#type': computed_twig
    '#title': twig_sfo_visibility
    '#states_clear': false
    '#display_on': form
    '#template': |-
      {% set rutekoersel = (data.rutekoersel_med_taxa_minibus == '1') %}
      {% set buskort = (data.buskort_til_offentlig_transport == '1') %}
      {% set morgen = (data.rutekoersel_aflevering_morgen == '1') %}
      {% set eftermiddag = (data.rutekoersel_afhentning_eftermiddag == '1') %}

      {# 1. Eftermiddag always wins #}
      {% if eftermiddag %}
        {{ 1 }}

      {# 2. Nothing selected at all #}
      {% elseif not rutekoersel and not buskort %}
        {{ 3 }}

      {# 3. Only buskort #}
      {% elseif not rutekoersel and buskort %}
        {{ 2 }}

      {# 4. Rutekørsel + morgen only (no buskort) #}
      {% elseif rutekoersel and morgen and not eftermiddag and not buskort %}
        {{ 3 }}

      {# 5. Rutekørsel but no selections #}
      {% elseif rutekoersel and not morgen and not eftermiddag %}
        {{ 1 }}

      {% elseif rutekoersel and morgen and not eftermiddag and buskort %}
        {{ 2 }}

      {# fallback #}
      {% else %}
        {{ 3 }}
      {% endif %}
    '#whitespace': trim
    '#store': true
  twig_barn_navn:
    '#type': computed_twig
    '#title': twig_barn_navn
    '#states_clear': false
    '#display_on': form
    '#template': '{{ data.barnets_navn_mitid ?: data.barnets_navn_manuelt }}'
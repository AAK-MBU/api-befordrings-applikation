services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: befordringssystemet
    environment:
      API_KEY: ${API_KEY}
      API_KEY_HASHES: ${API_KEY_HASHES}
    healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    networks:
      befordringssystemet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: befordringssystemet
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      BEFORDRING_API_KEY: ${BEFORDRING_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    networks:
      befordringssystemet-network

networks:
  befordringssystemet-network: {}
